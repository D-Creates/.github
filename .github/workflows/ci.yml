name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Profile README exists and links to the site
        run: |
          test -s profile/README.md
          grep -q "https://dcreations.fr" profile/README.md
          echo "Profile README OK"
